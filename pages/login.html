<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SMSPulse Portfolio Portal</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Specific styles to perfectly match the Alpaca Farm screenshots */
    body.login-body {
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
    }
    
    .login-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: var(--space-sm);
      z-index: 10;
    }
    
    .login-card {
      background-color: var(--bg-card);
      border-radius: 32px; /* Large, premium rounded corners like in screenshots */
      width: 100%;
      max-width: 500px;
      padding: var(--space-3xl) var(--space-2xl);
      box-shadow: 0 10px 40px rgba(27, 46, 36, 0.04);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all var(--transition-smooth);
    }
    
    .login-card__logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }
    
    .login-card__logo-box {
      width: 36px;
      height: 36px;
      background-color: var(--accent-color);
      color: var(--white);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    .login-card__logo-name {
      font-family: var(--font-headers);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--text-primary);
    }
    
    .login-card__title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: var(--space-xs);
      font-family: var(--font-headers);
      color: var(--text-primary);
    }
    
    .login-card__subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: var(--space-2xl);
    }
    
    /* Input field container with trailing icons (like password eyes) */
    .input-wrapper {
      position: relative;
      width: 100%;
    }
    
    .input-wrapper input {
      padding-right: 48px; /* Room for icon */
    }
    
    .input-wrapper__icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      transition: color var(--transition-fast);
    }
    
    .input-wrapper__icon:hover {
      color: var(--primary-color);
    }
    
    /* Checkbox & Forgot Password row styling */
    .login-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.85rem;
      margin-bottom: var(--space-xl);
    }
    
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    
    .remember-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
    }
    
    .forgot-link {
      color: var(--primary-color);
      font-weight: 600;
      transition: color var(--transition-fast);
    }
    
    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }
    
    /* Social Logins Split Line */
    .social-divider {
      position: relative;
      width: 100%;
      text-align: center;
      margin: var(--space-xl) 0;
    }
    
    .social-divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background-color: var(--border-color);
      z-index: 1;
    }
    
    .social-divider span {
      position: relative;
      background-color: var(--bg-card);
      padding: 0 var(--space-md);
      font-size: 0.8rem;
      color: var(--text-secondary);
      z-index: 2;
    }
    
    /* Social Login Buttons */
    .social-btn-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      width: 100%;
      margin-bottom: var(--space-xl);
    }
    
    .btn-social {
      width: 100%;
      padding: 12px var(--space-xl);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      background-color: var(--bg-card);
      transition: all var(--transition-fast);
    }
    
    .btn-social:hover {
      background-color: var(--bg-secondary);
      border-color: var(--primary-color);
      transform: translateY(-1px);
    }
    
    .btn-social i {
      font-size: 1.1rem;
    }
  </style>
</head>
<body class="login-body">

  <!-- Corner Controls matching layout screenshots -->
  <div class="login-controls">
    <button class="btn-icon rtl-toggle-btn" aria-label="Toggle Direction">RTL</button>
    <button class="btn-icon theme-toggle-btn" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Centered Login Card -->
  <main class="login-card animate-slide-up">
    <!-- Brand Logo header block -->
    <div class="login-card__logo">
      <div class="login-card__logo-box"><i class="fa-solid fa-comment-sms"></i></div>
      <span class="login-card__logo-name">SMSPulse</span>
    </div>

    <h1 class="login-card__title">Welcome Back</h1>
    <p class="login-card__subtitle">Sign in to your SMSPulse client account</p>

    <!-- Interactive Form with custom validation -->
    <form class="needs-validation" novalidate style="width: 100%;" action="dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address <span>*</span></label>
        <input type="email" class="form-input" id="login-email" placeholder="name@yourbrand.com" required>
        <span class="form-error-msg">Please enter a valid business email.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-pass">Password <span>*</span></label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="login-pass" placeholder="Enter password" required>
          <span class="input-wrapper__icon" id="toggle-password-visibility" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </span>
        </div>
        <span class="form-error-msg">Please enter your password.</span>
      </div>

      <!-- Remember Row -->
      <div class="login-options-row">
        <label class="remember-label">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <a href="coming-soon.html" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn--primary" style="width: 100%; padding: 14px var(--space-2xl); font-size: 1rem;"><i class="fa-solid fa-right-to-bracket"></i> SIGN IN</button>
    </form>

    <!-- Social Section -->
    <div class="social-divider">
      <span>or continue with</span>
    </div>

    <div class="social-btn-container">
      <button class="btn-social" type="button"><i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google</button>
      <button class="btn-social" type="button"><i class="fa-brands fa-apple" style="color: var(--text-primary);"></i> Continue with Apple</button>
    </div>

    <!-- Toggle footer -->
    <p style="font-size: 0.9rem; color: var(--text-secondary);">Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight:700;">Create one free</a></p>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
  
  <script>
    // Reveal Password Logic
    document.addEventListener('DOMContentLoaded', () => {
      const toggleIcon = document.getElementById('toggle-password-visibility');
      const passField = document.getElementById('login-pass');
      
      if (toggleIcon && passField) {
        toggleIcon.addEventListener('click', () => {
          const isPass = passField.type === 'password';
          passField.type = isPass ? 'text' : 'password';
          
          const icon = toggleIcon.querySelector('i');
          if (icon) {
            icon.className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
          }
        });
      }
    });
  </script>
</body>
</html>
