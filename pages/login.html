<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SMSPulse Portfolio Portal</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Specific styles to perfectly match the Alpaca Farm screenshots */
    body.login-body {
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
    }
    
    .login-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: var(--space-sm);
      z-index: 100;
    }
    
    @media (max-width: 480px) {
      .login-controls {
        top: 8px;
        right: 8px;
      }
      .login-card {
        margin-top: 40px;
      }
    }
    
    .login-card {
      background-color: var(--bg-card);
      border-radius: 32px; /* Large, premium rounded corners like in screenshots */
      width: 100%;
      max-width: 500px;
      padding: var(--space-3xl) var(--space-2xl);
      box-shadow: 0 10px 40px rgba(27, 46, 36, 0.04);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all var(--transition-smooth);
    }
    
    .login-card__logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }
    
    .login-card__logo-box {
      width: 36px;
      height: 36px;
      background-color: var(--accent-color);
      color: var(--white);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    .login-card__logo-name {
      font-family: var(--font-headers);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--text-primary);
    }
    
    .login-card__title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: var(--space-xs);
      font-family: var(--font-headers);
      color: var(--text-primary);
    }
    
    .login-card__subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: var(--space-2xl);
    }
    
    /* Input field container with trailing icons (like password eyes) */
    .input-wrapper {
      position: relative;
      width: 100%;
    }
    
    .input-wrapper input {
      padding-right: 48px; /* Room for icon */
    }
    
    .input-wrapper__icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      transition: color var(--transition-fast);
    }
    
    .input-wrapper__icon:hover {
      color: var(--primary-color);
    }
    
    /* Checkbox & Forgot Password row styling */
    .login-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.85rem;
      margin-bottom: var(--space-xl);
    }
    
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    
    .remember-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
    }
    
    @media (max-width: 380px) {
      .login-card {
        padding: var(--space-xl) var(--space-md);
      }
      .login-options-row {
        font-size: 0.7rem;
        gap: 5px;
      }
      .remember-label {
        gap: 4px;
      }
      .remember-label input {
        width: 14px;
        height: 14px;
      }
    }
    
    .forgot-link {
      color: var(--primary-color);
      font-weight: 600;
      transition: color var(--transition-fast);
    }
    
    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }
    

  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>
<body class="login-body">

  <!-- Corner Controls matching layout screenshots -->
  <div class="login-controls">
    <button class="btn-icon rtl-toggle-btn" aria-label="Toggle Direction">RTL</button>
    <button class="btn-icon theme-toggle-btn" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Centered Login Card -->
  <main class="login-card animate-slide-up">
    <!-- Brand Logo -->
    <a href="../index.html" class="login-card__logo" style="text-decoration: none;">
      <div class="login-card__logo-box"><i class="fa-solid fa-comment-sms"></i></div>
      <span class="login-card__logo-name">SMSPulse</span>
    </a>

    <h1 class="login-card__title">Welcome Back</h1>
    <p class="login-card__subtitle">Sign in to your SMSPulse client account</p>

    <!-- Interactive Form with custom validation -->
    <form class="needs-validation" novalidate style="width: 100%;" action="dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address <span>*</span></label>
        <input type="email" class="form-input" id="login-email" placeholder="" required>
        <span class="form-error-msg">Please enter a valid business email.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-pass">Password <span>*</span></label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="login-pass" placeholder="" required>
          <span class="input-wrapper__icon" id="toggle-password-visibility" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </span>
        </div>
        <span class="form-error-msg">Please enter your password.</span>
      </div>

      <!-- Remember Row -->
      <div class="login-options-row">
        <label class="remember-label">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <a href="coming-soon.html" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn--primary" style="width: 100%; padding: 14px var(--space-2xl); font-size: 1rem;"><i class="fa-solid fa-right-to-bracket"></i> SIGN IN</button>
    </form>

    <!-- Social Section -->
    <div class="social-divider">
      <span>or continue with</span>
    </div>

    <div class="social-btn-container">
      <button class="btn-social btn-social--google" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
        Continue with Google
      </button>
      <button class="btn-social btn-social--apple" type="button">
        <i class="fa-brands fa-apple"></i>
        Continue with Apple
      </button>
    </div>

    <!-- Toggle footer -->
    <p style="font-size: 0.9rem; color: var(--text-secondary);">Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight:700;">Create one free</a></p>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
  
  <script>
    // Reveal Password Logic
    document.addEventListener('DOMContentLoaded', () => {
      const toggleIcon = document.getElementById('toggle-password-visibility');
      const passField = document.getElementById('login-pass');
      
      if (toggleIcon && passField) {
        toggleIcon.addEventListener('click', () => {
          const isPass = passField.type === 'password';
          passField.type = isPass ? 'text' : 'password';
          
          const icon = toggleIcon.querySelector('i');
          if (icon) {
            icon.className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
          }
        });
      }
    });
  </script>
</body>
</html>
